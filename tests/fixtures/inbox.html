<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Inbox</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #ffffff;
      }
      .app {
        display: grid;
        grid-template-columns: 240px 1fr;
        grid-template-rows: 65px 1fr;
        height: 100%;
      }
      header {
        grid-column: 1 / -1;
        background: #2449d8;
        color: #ffffff;
        font: 700 16px/65px Roboto, Arial, sans-serif;
        padding: 0 16px;
      }
      aside {
        background: #111827;
        color: #ffffff;
        font: 600 14px/1.4 Roboto, Arial, sans-serif;
        padding: 16px;
      }
      #list {
        overflow-y: auto;
        background: #ffffff;
      }
      .row {
        position: relative;
        height: 44px;
        box-sizing: border-box;
        border-bottom: 1px solid #dce1ea;
        padding: 12px 16px 0 48px;
        font: 16px/20px Roboto, Arial, sans-serif;
        color: #111827;
        background: #ffffff;
      }
      .swatch {
        position: absolute;
        left: 8px;
        top: 8px;
        width: 28px;
        height: 28px;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header>Inbox</header>
      <aside>Mailboxes</aside>
      <div id="list"></div>
    </div>
    <script>
      function swatchColor(n) {
        return [
          20 + ((n * 47) % 200),
          20 + ((n * 89) % 200),
          20 + ((n * 131) % 200),
        ];
      }
      const list = document.getElementById("list");
      for (let i = 1; i <= 60; i += 1) {
        const row = document.createElement("div");
        row.className = "row";
        row.textContent = `Row ${String(i).padStart(2, "0")}`;
        const swatch = document.createElement("div");
        swatch.className = "swatch";
        const [r, g, b] = swatchColor(i);
        swatch.style.background = `rgb(${r}, ${g}, ${b})`;
        row.appendChild(swatch);
        list.appendChild(row);
      }
    </script>
  </body>
</html>

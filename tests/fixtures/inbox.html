<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Inbox</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #ffffff;
      }
      .app {
        display: grid;
        grid-template-columns: 240px 1fr;
        grid-template-rows: 56px 1fr;
        height: 100%;
      }
      header {
        grid-column: 1 / -1;
        background: #2449d8;
        color: #ffffff;
        font: 700 16px/56px Roboto, Arial, sans-serif;
        padding: 0 16px;
      }
      aside {
        background: #111827;
        color: #ffffff;
        font: 600 14px/1.4 Roboto, Arial, sans-serif;
        padding: 16px;
      }
      #list {
        overflow-y: auto;
        background: #ffffff;
      }
      .row {
        height: 44px;
        box-sizing: border-box;
        border-bottom: 1px solid #dce1ea;
        padding: 12px 16px;
        font: 16px/20px Roboto, Arial, sans-serif;
        color: #111827;
      }
      .row:nth-child(odd) {
        background: #f4f7fb;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header>Inbox</header>
      <aside>Mailboxes</aside>
      <div id="list">
        <!-- rows injected so the fixture file stays readable; the test also accepts these 60 -->
      </div>
    </div>
    <script>
      const list = document.getElementById("list");
      for (let i = 1; i <= 60; i += 1) {
        const row = document.createElement("div");
        row.className = "row";
        row.textContent = `Row ${String(i).padStart(2, "0")}`;
        list.appendChild(row);
      }
    </script>
  </body>
</html>
